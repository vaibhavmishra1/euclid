# Rentropy Configuration
# This file controls the diversity reward settings for the Rentropy experiment.

# Diversity reward mode (1-4):
#   1: Vanilla majority voting reward only (R-Zero baseline)
#   2: Mode 1 + reward for choosing a rare cluster
#   3: Mode 2 + reward for uniqueness from other n-1 questions in batch  
#   4: Mode 3 + within-cluster uniqueness reward
diversity_mode: 4

# Path to cluster centroids (built by cluster_space/build_clusters.py)
centroids_path: "../cluster_space/cluster_data/centroids.npy"

# Embedding model for cluster assignment
embedding_model: "Qwen/Qwen3-Embedding-0.6B"

# Reward weights (only applied when majority vote passes threshold)
weights:
  # Weight for rarity reward (mode 2+)
  rarity: 0.1
  # Weight for batch uniqueness reward (mode 3+)
  batch_uniqueness: 0.05
  # Weight for within-cluster uniqueness (mode 4)
  within_cluster_uniqueness: 0.05

# Majority voting threshold - diversity reward only applied if score >= this
majority_vote_threshold: 0.3

# Scale diversity reward by ZPD score (Zone of Proximal Development)
# When true: diversity_reward *= (min(score, 1-score) / 0.5)
# This prevents reward hacking via "easy but rare" questions:
#   - Easy questions (score=0.9): zpd=0.1, scale=0.2 → small bonus
#   - Medium questions (score=0.5): zpd=0.5, scale=1.0 → full bonus
#   - Hard questions (score=0.3): zpd=0.3, scale=0.6 → medium bonus
scale_diversity_by_zpd: true

# EMA decay for cluster count tracking
ema_decay: 0.99

# Smoothing constant for log-inverse-frequency
smoothing_alpha: 1.0

# Logging frequency for cluster statistics (log every N reward computations)
# Set to 1 to log every step, higher values reduce logging overhead
log_cluster_stats_freq: 1
