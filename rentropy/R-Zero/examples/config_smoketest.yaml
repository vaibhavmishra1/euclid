# Smoke test configuration - Minimal compute for testing all 4 Rentropy variants
# Uses smallest model and minimal iterations

data:
  train_files: hiyouga/math12k@train
  val_files: hiyouga/math12k@test
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 1024  # Reduced
  max_response_length: 1024  # Reduced from 2048
  rollout_batch_size: 64  # Reduced from 512
  val_batch_size: 64  # Reduced from 1024
  format_prompt: ./examples/format_prompt/math_format.jinja
  override_chat_template: null
  shuffle: true
  seed: 42
  max_pixels: 4194304
  min_pixels: 262144
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  mock_data: test

worker:
  actor:
    global_batch_size: 8  # Reduced from 128
    micro_batch_size_per_device_for_update: 1  # Reduced
    micro_batch_size_per_device_for_experience: 2  # Reduced
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: Qwen/Qwen3-0.6B-Base  # Smallest model
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
    optim:
      lr: 1.0e-5  # Slightly higher for faster learning in smoke test
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false  # Faster without offload for small model
      offload_optimizer: false

  rollout:
    n: 5  # Reduced from 5
    temperature: 1.0
    top_p: 0.99
    gpu_memory_utilization: 0.8
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1  # Single GPU
    limit_images: 0
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score

trainer:
  total_epochs: 10
  max_steps: 2  # Minimal steps
  project_name: rentropy_smoketest
  experiment_name: smoketest
  logger: ["console"]  # No wandb for smoke test
  nnodes: 1
  n_gpus_per_node: 1  # Single GPU
  val_freq: -1  # Disable validation
  val_before_train: false
  val_only: false
  val_generations_to_log: 1
  save_freq: 1
  save_limit: 1
  save_checkpoint_path: ./smoketest_output
  load_checkpoint_path: null
