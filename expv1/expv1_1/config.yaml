# ExpV1_1 Configuration: GRPO Training with Self-Consistency Rewards
# 
# This experiment compares GRPO (RL) vs SFT (ExpV1_0) on the same dataset.
# 
# Key difference:
# - ExpV1_0 (SFT): Trains on solver's best COT (selected via self-consistency)
# - ExpV1_1 (GRPO): Uses SELF-CONSISTENCY across rollouts to compute rewards
#   (no ground truth needed - modal answer across rollouts is treated as "correct")

grpo:
  # ==========================================================================
  # Model Configuration
  # ==========================================================================
  model_name_or_path: "Qwen/Qwen3-1.7B-Base"  # Same as ExpV1_0 for fair comparison
  
  # ==========================================================================
  # Data Configuration
  # ==========================================================================
  # Path to ExpV1_0 accepted dataset (relative to workspace root)
  # Use the same data that was used for SFT in ExpV1_0
  # NOTE: Only the 'problem' field is used - 'answer' is NOT used for rewards
  dataset_path: "tree/euclid/expv1/expv1_0/output_Qwen3-1.7B-Base_accepted/accepted_verified_retried.jsonl"
  # Alternative: Use all accepted data (not just verified)
  # dataset_path: "tree/euclid/expv1/expv1_0/output_Qwen3-1.7B-Base_accepted/accepted.jsonl"
  
  # Prompt template (null = use default matching ExpV1_0)
  prompt_template: null
  
  # Token limits
  max_prompt_length: 512
  max_response_length: 1024
  
  # ==========================================================================
  # GRPO-Specific Configuration
  # ==========================================================================
  # Number of generations per prompt (group size for advantage estimation)
  # Higher = better advantage estimates but more compute
  # GRPO paper typically uses 4-16
  num_generations: 4
  
  # Sampling parameters for generation
  temperature: 0.8  # Higher for more exploration
  top_p: 0.95
  
  # KL penalty coefficient (prevents divergence from reference model)
  # Higher = more conservative updates
  # Typical range: 0.01-0.1
  kl_coef: 0.05
  
  # ==========================================================================
  # Self-Consistency Reward Configuration
  # ==========================================================================
  # Rewards are computed via SELF-CONSISTENCY across rollouts:
  # 1. Extract \boxed{} answer from each of the num_generations rollouts
  # 2. Find the modal (majority) answer
  # 3. Reward rollouts that agree with the modal answer
  # 4. No ground truth answer is needed!
  
  # Reward values
  correct_reward: 1.0    # For rollouts matching the modal answer
  incorrect_reward: 0.0  # For rollouts NOT matching the modal answer
  
  # Penalty for missing \boxed{} format (encourages proper formatting)
  format_penalty: 0.1
  
  # Minimum number of rollouts that must agree for an answer to be considered "consensus"
  # If fewer rollouts agree, no rewards are given (all get incorrect_reward)
  # This prevents rewarding answers with low confidence
  # Typical: 2 for num_generations=4, 3 for num_generations=8
  min_agreement: 2
  
  # ==========================================================================
  # Training Configuration
  # ==========================================================================
  num_train_epochs: 1  # GRPO typically needs fewer epochs than SFT
  
  # Batch size: effective_batch = per_device × num_gpus × gradient_accum
  # Note: Each prompt generates num_generations sequences
  # So total sequences = per_device × num_generations × gradient_accum × num_gpus
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  
  # Learning rate (typically lower than SFT for RL)
  learning_rate: 1.0e-6
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  
  # ==========================================================================
  # Output Configuration
  # ==========================================================================
  output_dir: "./output_expv1_1_grpo"
  
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  
  # ==========================================================================
  # Hardware Configuration
  # ==========================================================================
  bf16: true  # Use bfloat16 for training
  gradient_checkpointing: true  # Reduce memory usage
  
  # ==========================================================================
  # vLLM Configuration (for fast rollout generation)
  # ==========================================================================
  # vLLM provides 10-20x faster generation compared to HuggingFace generate()
  # This is critical for GRPO which needs many rollouts per prompt
  use_vllm: true
  vllm_device: "cuda"
  vllm_gpu_memory_utilization: 0.7  # Leave room for training
  vllm_dtype: "bfloat16"
  vllm_tensor_parallel_size: 1  # Increase for larger models or multi-GPU
  vllm_max_model_len: null  # Auto-detect from model config
  
  # ==========================================================================
  # Miscellaneous
  # ==========================================================================
  seed: 42
  
  # HuggingFace Hub (optional)
  push_to_hub: false
  hub_model_id: null  # e.g., "vibhuiitj/Qwen3-1.7B-Base-grpo-expv1_1"


# ==========================================================================
# Self-Consistency Reward Mechanism (Key Innovation)
# ==========================================================================
# 
# For synthetic datasets generated via concept graph exploration,
# there is NO ground truth answer. Instead, we use self-consistency:
#
# For each prompt:
#   1. Generate num_generations rollouts
#   2. Extract \boxed{answer} from each
#   3. Find modal (most common) answer
#   4. If modal_count >= min_agreement:
#      - Rollouts matching modal → correct_reward (1.0)
#      - Rollouts not matching → incorrect_reward (0.0)
#   5. If modal_count < min_agreement:
#      - All rollouts get incorrect_reward (0.0) - no consensus
#
# This is the SAME mechanism used in ExpV1_0's ZPD filtering,
# but now applied during training to compute rewards on-the-fly.
#
# ==========================================================================

# ==========================================================================
# Experiment Notes
# ==========================================================================
# 
# Comparison with ExpV1_0:
# 
# | Aspect          | ExpV1_0 (SFT)          | ExpV1_1 (GRPO)            |
# |-----------------|------------------------|---------------------------|
# | Training signal | Best COT (supervised)  | Self-consistency reward   |
# | Ground truth    | Precomputed modal ans  | Computed during training  |
# | Rollouts used   | 1 (best only)          | All (num_generations)     |
# | Learning        | Imitation              | Trial and error           |
# | Data efficiency | Higher (direct target) | Lower (needs exploration) |
# 
# Hypothesis:
# - GRPO may show different learning dynamics
# - GRPO learns from failures (incorrect solutions get negative advantage)
# - SFT only learns from successes (best solutions)
# - Self-consistency rewards allow training on ANY synthetic data
# 
# Metrics to track:
# - MATH number_theory accuracy (same as ExpV1_0)
# - Training reward curve
# - Agreement rate (% of prompts with consensus)
# - Generation diversity
