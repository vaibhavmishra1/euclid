# Configuration for Knowledge-Point-Based Curriculum Training
# This config extends the base config for curriculum learning

data:
  train_files: hiyouga/math12k@train  # Will be overridden by knowledge point prompts
  val_files: hiyouga/math12k@test
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 4096  # Longer prompts for knowledge point context
  max_response_length: 4096
  rollout_batch_size: 256  # Smaller batch for more diverse KPs
  val_batch_size: 512
  format_prompt: ./examples/format_prompt/knowledge_challenger.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  max_pixels: 4194304
  min_pixels: 262144
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  mock_data: test

worker:
  actor:
    global_batch_size: 64  # Smaller batch for knowledge point training
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: Qwen/Qwen3-4B  # Default model
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 4  # 4 rollouts per prompt
    temperature: 1.0
    top_p: 0.99
    gpu_memory_utilization: 0.7
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    limit_images: 0
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: true

  reward:
    reward_type: batch
    reward_function: ./knowledge_curriculum/reward_function.py:compute_score
    num_cpus: 4  # CPUs for reward computation

trainer:
  total_epochs: 2
  max_steps: 6  # Challenger trains for fewer steps
  project_name: kp_rzero
  experiment_name: kp_challenger_training
  logger: ["console", "wandb"]
  nnodes: 1
  n_gpus_per_node: 4  # Adjust based on your setup
  val_freq: -1  # Disable validation for challenger
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 1  # Save every step for curriculum
  save_limit: 3
  save_checkpoint_path: your_checkpoint_path
  load_checkpoint_path: null

# Knowledge Point Curriculum Settings (custom fields)
curriculum:
  knowledge_points_path: /path/to/knowledge_points.jsonl
  alpha: 0.7  # Increase difficulty threshold
  beta: 0.3   # Decrease difficulty threshold
  questions_per_kp: 5
  min_difficulty: 1
  max_difficulty: 10
  num_iterations: 3
